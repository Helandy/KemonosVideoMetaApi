spring.application.name=video-meta-api
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:/data/video-meta.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jmx.enabled=false
# Бины создаются по мере обращения; планировщики помечены @Lazy(false), чтобы расписание регистрировалось сразу.
spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:true}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
app.statistics.datasource.url=${APP_STATISTICS_DATASOURCE_URL:jdbc:sqlite:/data/video-meta-statistics.db}
app.statistics.datasource.driver-class-name=${APP_STATISTICS_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
# Сколько дней хранить лог запросов; 0 отключает чистку.
app.statistics.retention-days=${APP_STATISTICS_RETENTION_DAYS:90}
app.statistics.retention.initial-delay-millis=${APP_STATISTICS_RETENTION_INITIAL_DELAY_MILLIS:120000}
app.statistics.retention.fixed-delay-millis=${APP_STATISTICS_RETENTION_FIXED_DELAY_MILLIS:86400000}
app.source-error-log.datasource.url=${APP_SOURCE_ERROR_LOG_DATASOURCE_URL:jdbc:sqlite:/data/video-meta-source-errors.db}
app.source-error-log.datasource.driver-class-name=${APP_SOURCE_ERROR_LOG_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
app.source-error-log.retry.initial-delay-millis=${APP_SOURCE_ERROR_LOG_RETRY_INITIAL_DELAY_MILLIS:30000}
app.source-error-log.retry.fixed-delay-millis=${APP_SOURCE_ERROR_LOG_RETRY_FIXED_DELAY_MILLIS:30000}
app.source-error-log.retry.batch-size=${APP_SOURCE_ERROR_LOG_RETRY_BATCH_SIZE:10}
app.source-error-log.retry.max-retry=${APP_SOURCE_ERROR_LOG_RETRY_MAX_RETRY:${APP_SOURCE_ERROR_LOG_RETRY_MAX_RETARY:3}}
app.rate-limit.max-requests=${APP_RATE_LIMIT_MAX_REQUESTS:60}
app.rate-limit.window-seconds=${APP_RATE_LIMIT_WINDOW_SECONDS:10}
app.source.max-concurrent-requests=${APP_SOURCE_MAX_CONCURRENT_REQUESTS:4}
app.source.allowed-host-suffixes=coomer.st,coomer.su,kemono.su,kemono.cr
app.source.allowed-audio-extensions=mp3,m4a,aac,wav,ogg,flac,opus,wma
app.source.allowed-video-extensions=mp4,m4v,mov,webm,avi,wmv,flv,mpeg,mpg,3gp,mkv
app.inspect.max-concurrent-requests-per-endpoint=${APP_INSPECT_MAX_CONCURRENT_REQUESTS_PER_ENDPOINT:${APP_SOURCE_MAX_CONCURRENT_REQUESTS:4}}
# Maximum number of concurrent /api/file/info requests.
app.inspect.file.max-concurrent-requests=${APP_INSPECT_FILE_MAX_CONCURRENT_REQUESTS:${APP_INSPECT_MAX_CONCURRENT_REQUESTS_PER_ENDPOINT:${APP_SOURCE_MAX_CONCURRENT_REQUESTS:4}}}
# Maximum number of concurrent /api/video/info requests.
app.inspect.video.max-concurrent-requests=${APP_INSPECT_VIDEO_MAX_CONCURRENT_REQUESTS:6}
# Maximum number of queued inspect requests allowed per client/IP.
app.inspect.max-queued-requests-per-user=${APP_INSPECT_MAX_QUEUED_REQUESTS_PER_USER:60}
app.inspect.max-queue-wait-seconds=${APP_INSPECT_MAX_QUEUE_WAIT_SECONDS:30}
app.thumbnail.root=${APP_THUMBNAIL_ROOT:/data/thumbnail}
app.thumbnail.generation-timeout-seconds=${APP_THUMBNAIL_GENERATION_TIMEOUT_SECONDS:30}
# Maximum number of simultaneous thumbnail generation pipelines.
# Каждый пайплайн — это отдельный процесс ffmpeg со своей native-памятью вне JVM.
app.thumbnail.max-concurrent-generations=${APP_THUMBNAIL_MAX_CONCURRENT_GENERATIONS:2}
# Высота, до которой ужимается исходный кадр перед подбором параметров сжатия.
app.thumbnail.source-frame-max-height=${APP_THUMBNAIL_SOURCE_FRAME_MAX_HEIGHT:720}
# Сколько данных удалённого потока ffmpeg буферизует для анализа контейнера.
app.thumbnail.source-probe-size=${APP_THUMBNAIL_SOURCE_PROBE_SIZE:2M}
app.thumbnail.source-analyze-duration-seconds=${APP_THUMBNAIL_SOURCE_ANALYZE_DURATION_SECONDS:2}
# Number of worker threads used by a single ffmpeg process.
app.thumbnail.ffmpeg-threads=${APP_THUMBNAIL_FFMPEG_THREADS:2}
app.thumbnail.scale-flags=${APP_THUMBNAIL_SCALE_FLAGS:area}
app.thumbnail.webp-compression-level=${APP_THUMBNAIL_WEBP_COMPRESSION_LEVEL:4}
app.admin.key.path=${APP_ADMIN_KEY_PATH:/data/.admin.key}
app.admin.max-failed-attempts=${APP_ADMIN_MAX_FAILED_ATTEMPTS:10}
app.admin.ban-minutes=${APP_ADMIN_BAN_MINUTES:60}
# Полезная параллельность ограничена семафорами inspect (единицы запросов),
# поэтому сотни потоков давали только стеки в native-памяти, а не пропускную способность.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:32}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:5}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:512}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
